<?xml version="1.0" encoding="UTF-8"?>
<!-- 하트 중심선 도안. 3차 Bézier 6개로 이루어진 닫힌 subpath 하나.
     시율님 9/18 실기에서 새긴 하트(폭 24mm)와 같은 조건으로 쓰기 위한 도안이다.
     viewBox 단위는 상대값이고, 실제 mm 크기는 extract_2d 가 요청 크기로 맞춘다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="52" viewBox="-30 -22 60 52" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path id="heart" fill="none" stroke="#000" stroke-width="0.5"
        d="M 0,29
           C -13,19 -27,10 -27,-2
           C -27,-11 -21,-17 -12,-17
           C -6,-17 -1,-13 0,-9
           C 1,-13 6,-17 12,-17
           C 21,-17 27,-11 27,-2
           C 27,10 13,19 0,29
           Z" />
</svg>
