/sim/m0609/controller_manager:
  ros__parameters:
    update_rate: 60
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/sim/m0609/arm_controller:
  ros__parameters:
    joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 60.0
    action_monitor_rate: 30.0
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 5.0
      joint_1:
        trajectory: 0.08
        goal: 0.015
      joint_2:
        trajectory: 0.08
        goal: 0.015
      joint_3:
        trajectory: 0.08
        goal: 0.015
      joint_4:
        trajectory: 0.08
        goal: 0.015
      joint_5:
        trajectory: 0.08
        goal: 0.015
      joint_6:
        trajectory: 0.08
        goal: 0.015
/sim/m0609/gripper_controller:
  ros__parameters:
    joints:
    - rg2_finger_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 6.0
      rg2_finger_joint:
        trajectory: 0.5
        goal: 0.05
/sim/m0609/joint_state_broadcaster:
  ros__parameters:
    publish_rate: 60.0
