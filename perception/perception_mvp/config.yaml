# Measured inputs and explicitly adopted trial models. Remaining nulls require
# actual inputs; trial layer values are not board-mounted depth validation.
camera:
  serial: null
  width: 1280  # Recorded RGB CameraInfo; verify against the live ROS stream.
  height: 720
  fps: null
  timeout_ms: null
hand:
  weights: models/hand_yolo11n_added_20261012/weights/best.pt
  # Copied from the saved V0 hand profile; trial values, not safety validation.
  confidence: 0.25
  board_roi_v0: [392, 3, 1128, 702]
  board_polygon_v0: [[392, 3], [1127, 4], [1106, 699], [396, 701]]
  board_image_size: [1280, 720]
  min_valid_depth_fraction: 0.8
  stable_mean_difference: 3.0
  stable_seconds: 1.0
  max_frame_gap_seconds: 1.0
  exit_seconds: 3.0  # strict >3 seconds per user decision
geometry:
  calibration_id: assembly_pitch16_flat0_20261013
  coordinate_rules: '+X A->B, +Y A->D; origin reference stud centre; zero-based minimum footprint anchor; layer 1..5'
  point_reference: visible_surface_center
  threshold_status: temporary_test
  stud_pitch_m: 0.016  # User-adopted 16 mm; matches all three active calibrations.
  # Nominal pitch-derived outer bounds, half a pitch beyond the first/last stud centres.
  board_bounds_m: [[-0.008, 0.376], [-0.008, 0.376]]
  # Trial model: first top 22mm + (layer-1)*18.625mm, tolerance +/-2.5mm.
  # First top was measured on blocks alone; board-mounted baseline still needs verification.
  top_heights_m: [0.022, 0.040625, 0.05925, 0.077875, 0.0965]
  layer_increment_m: 0.018625
  layer_reference_status: trial_average_unvalidated_board_baseline
  layer_height_reference: BOARD_FLAT_SURFACE_ZERO
  board_stud_height_m: 0.004
  block_surface_height_basis: BODY_TOP_PLUS_STUD
  block_stud_height_m: 0.004
  # Nominal stud spans, not individually measured plastic body dimensions.
  footprint_sizes_m:
    yellow_2x2: [0.032, 0.032]
    blue_2x2: [0.032, 0.032]
    yellow_2x3: [0.032, 0.048]
    blue_2x3: [0.032, 0.048]
    red_2x1: [0.016, 0.032]
  # Internal keys are long-axis angles; common block keys below are footprint orientations.
  center_offsets_stud:
    yellow_2x2: {'0': [0.5, 0.5]}
    blue_2x2: {'0': [0.5, 0.5]}
    yellow_2x3: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
    blue_2x3: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
    red_2x1: {'0': [0.5, 0.0], '90': [0.0, 0.5]}
  center_to_anchor_offsets_stud:
    yellow_2x2: {'0': [0.5, 0.5]}
    blue_2x2: {'0': [0.5, 0.5]}
    yellow_2x3: {'0': [0.5, 1.0], '90': [1.0, 0.5]}
    blue_2x3: {'0': [0.5, 1.0], '90': [1.0, 0.5]}
    red_2x1: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
  min_confidence: 0.25  # Existing block inference trial setting, not validated accuracy.
  min_valid_fraction: 0.8  # Existing integrated-view trial threshold.
  min_depth_pixels: 50  # Existing integrated-view trial threshold.
  # Optical Z range of the calibrated board volume up to 5F+2.5mm (99mm).
  # Additional 5mm camera-Z margin is a trial allowance, not sensor accuracy.
  min_depth_m: 0.334
  max_depth_m: 0.763
  depth_ranges_m:
    V0: {min_depth_m: 0.443, max_depth_m: 0.573}
    D1: {min_depth_m: 0.334, max_depth_m: 0.763}
    D3: {min_depth_m: 0.397, max_depth_m: 0.696}
  depth_range_status: calibration_derived_trial_not_depth_validated
  depth_range_margin_m: 0.005
  grid_tolerance_stud: 0.25  # Existing grid_anchor trial threshold.
  size_tolerance_m: 0.0056  # Existing 0.35-stud size tolerance at 16mm pitch.
  height_tolerance_m: 0.0025
  # Trial P95-P5 limit; matches the 5mm total layer tolerance width, not measured noise.
  max_height_spread_m: 0.005
  angle_tolerance_deg: 10.0  # Existing integrated-view trial threshold.
