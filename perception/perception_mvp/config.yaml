# Measured inputs and explicitly adopted trial models. Remaining nulls require
# actual inputs; trial layer values are not board-mounted depth validation.
camera:
  serial: null
  width: 1280  # Recorded RGB CameraInfo; verify against the live ROS stream.
  height: 720
  fps: null
  timeout_ms: null
hand:
  weights: models/hand_yolo11n_added_20261012/weights/best.pt
  # Copied from the saved V0 hand profile; trial values, not safety validation.
  confidence: 0.25
  board_roi_v0: [392, 3, 1128, 702]
  board_polygon_v0: [[392, 3], [1127, 4], [1106, 699], [396, 701]]
  board_image_size: [1280, 720]
  min_valid_depth_fraction: 0.8
  stable_mean_difference: 3.0
  stable_seconds: 1.0
  max_frame_gap_seconds: 1.0
  exit_seconds: 3.0  # strict >3 seconds per user decision
geometry:
  assembly_roi_root: recordings/assembly_board_roi
  calibration_id: assembly_pitch16_flat0_20261013
  coordinate_rules: '+X A->B, +Y A->D; origin reference stud centre; zero-based minimum footprint anchor; layer 1..5'
  point_reference: visible_surface_center
  threshold_status: temporary_test
  stud_pitch_m: 0.016  # User-adopted 16 mm; matches all three active calibrations.
  # Nominal pitch-derived outer bounds, half a pitch beyond the first/last stud centres.
  board_bounds_m: [[-0.008, 0.376], [-0.008, 0.376]]
  # Trial model: first top 22mm + (layer-1)*18.625mm, tolerance +/-2.5mm.
  # First top was measured on blocks alone; board-mounted baseline still needs verification.
  top_heights_m: [0.022, 0.040625, 0.05925, 0.077875, 0.0965]
  layer_increment_m: 0.018625
  layer_reference_status: trial_average_unvalidated_board_baseline
  layer_height_reference: BOARD_FLAT_SURFACE_ZERO
  board_stud_height_m: 0.004
  # 2026-10-13 user decision: saved aligned Depth does not resolve the 4mm studs (they are
  # visible in RGB only). Measure the supported top plane and add the physical stud once.
  block_surface_height_basis: TOP_PLANE_PLUS_STUD
  block_stud_height_m: 0.004
  # Nominal stud spans, not individually measured plastic body dimensions.
  footprint_sizes_m:
    yellow_2x2: [0.032, 0.032]
    blue_2x2: [0.032, 0.032]
    yellow_2x3: [0.032, 0.048]
    blue_2x3: [0.032, 0.048]
    red_2x1: [0.016, 0.032]
  # Internal keys are long-axis angles; common block keys below are footprint orientations.
  center_offsets_stud:
    yellow_2x2: {'0': [0.5, 0.5]}
    blue_2x2: {'0': [0.5, 0.5]}
    yellow_2x3: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
    blue_2x3: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
    red_2x1: {'0': [0.5, 0.0], '90': [0.0, 0.5]}
  center_to_anchor_offsets_stud:
    yellow_2x2: {'0': [0.5, 0.5]}
    blue_2x2: {'0': [0.5, 0.5]}
    yellow_2x3: {'0': [0.5, 1.0], '90': [1.0, 0.5]}
    blue_2x3: {'0': [0.5, 1.0], '90': [1.0, 0.5]}
    red_2x1: {'0': [0.0, 0.5], '90': [0.5, 0.0]}
  min_confidence: 0.25  # Existing block inference trial setting, not validated accuracy.
  min_valid_fraction: 0.8  # Existing integrated-view trial threshold.
  min_depth_pixels: 50  # Existing integrated-view trial threshold.
  # Optical Z range of the calibrated board volume up to 5F+2.5mm (99mm).
  # Additional 5mm camera-Z margin is a trial allowance, not sensor accuracy.
  min_depth_m: 0.334
  max_depth_m: 0.763
  depth_ranges_m:
    V0: {min_depth_m: 0.441, max_depth_m: 0.573}
    D1: {min_depth_m: 0.332, max_depth_m: 0.763}
    D3: {min_depth_m: 0.395, max_depth_m: 0.696}
  # min_depth lowered 2mm after the layer tolerance widened to 5mm (top layer + 5mm is closer to the camera); max unchanged.
  depth_range_status: calibration_derived_trial_not_depth_validated
  depth_range_margin_m: 0.005
  grid_tolerance_stud: 0.25  # Existing grid_anchor trial threshold.
  size_tolerance_m: 0.0056  # Existing 0.35-stud size tolerance at 16mm pitch.
  # Layer tolerance widened from 0.0025 to 0.005 (owner decision 2026-10-14) so the layer index
  # survives D1/D3 board-baseline offsets. Layer spacing is 18.625mm; code requires 2*tolerance < spacing.
  # Still a trial value, not a measured accuracy.
  height_tolerance_m: 0.005
  # Layer ranges: contiguous bands on the final height; layer 1 is first_layer_min..bounds[0], layer n is
  # bounds[n-2]..bounds[n-1]. Above the last bound or below first_layer_min is UNKNOWN. Trial values.
  first_layer_min_height_m: 0.006
  # Layer 1 ends at first_layer_max (24.5mm); layer 2 starts above layer_upper_bounds_m[0] (26mm).
  # Heights between the two (24.5..26mm) are UNKNOWN.
  first_layer_max_height_m: 0.0245
  layer_upper_bounds_m: [0.026, 0.0432, 0.064, 0.083, 0.103]
  # Stud-midpoint layer (owner decision 2026-10-15): RGB finds two adjacent block studs, Depth is read
  # in a small disc at their midpoint (flat top face between the studs). Layer-only extra result
  # `stud_layer` beside the existing record; position/orientation still come from the top-plane path.
  # Trial values from 8 captures of one scene (6 blocks), not a measured accuracy. Pixel values are for
  # the current V0 distance; the expected stud pair distance itself is computed from focal length,
  # stud pitch and depth.
  stud_layer:
    canny_low: 40
    canny_high: 120
    minimum_contour_points: 5
    minimum_diameter_px: 4.0
    maximum_diameter_px: 80.0
    minimum_axis_ratio: 0.35
    maximum_normalized_residual: 0.20
    merge_px: 5.0
    pitch_tolerance_fraction: 0.10
    window_radius_px: 6.0
    minimum_window_points: 30
    mask_dilate_px: 1
    box_margin_px: 4
  # Per-capture board baseline (owner decision 2026-10-14): fit the board plate plane away from detected
  # blocks and take layer heights relative to it. Measured 2026-10-14: V0 depth read the plate about 5mm
  # below the calibration datum. Trial method; an unreliable fit leaves blocks UNKNOWN, never uncorrected.
  board_baseline: PLATE_PLANE_FIT
  board_baseline_min_points: 2000
  board_baseline_max_tilt_deg: 3.0
  board_baseline_max_residual_std_m: 0.005
  board_baseline_max_correction_m: 0.015
  board_baseline_exclusion_px: 15
  board_baseline_z_window_m: 0.03
  # Trial P95-P5 limit, unchanged at 5mm and independent of the layer tolerance above; not measured noise.
  max_height_spread_m: 0.005
  angle_tolerance_deg: 10.0  # Existing integrated-view trial threshold.
