name: Issue management

on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned]
  issue_comment:
    types: [created]
  milestone:
    types: [edited]
  schedule:
    # Weekdays 18:40 KST. GitHub may delay scheduled runs.
    - cron: '40 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: c2-issue-management
  cancel-in-progress: false

jobs:
  manage:
    if: >-
      github.repository == 'suuuhululu/C-2' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (!github.event.issue.pull_request && startsWith(github.event.comment.body, '/team ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Assign work and reconcile schedules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/issue_manager.py --apply
